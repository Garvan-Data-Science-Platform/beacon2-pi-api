beacon:
  image:
    repository: "australia-southeast1-docker.pkg.dev/beacon-guardians/beacon-images/beacon-app"
    tag: "v1"

  service:
    # type: ClusterIP
    nodePort: null

ingress:
  enabled: true
  host: "beacon.dsp.garvan.org.au"
  backendConfigName: "beacon-prod-health-config"
  managedCertName: "beacon-prod-ssl-cert"
  staticIpName: "beacon-prod-static-ip"
  allowedPaths:
    - path: /*
      pathType: ImplementationSpecific
  #   - path: /api
  #     pathType: Exact

  #   - path: /api/cohorts
  #     pathType: Prefix

localDev:
  createHostPathPV: false

mongodb:
  selectorLabel: "mongo"
  persistence:
    storageClass: "standard-rwo"

environment: "prod"
