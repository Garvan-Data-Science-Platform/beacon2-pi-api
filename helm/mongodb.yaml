# --- Persistent Volume (for local Minikube/Docker Desktop) ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mongo" # This path must exist on your Minikube node

---
# --- Secret for MongoDB Credentials ---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "example"
---
# --- Headless Service for MongoDB ---
# This gives the StatefulSet a stable network DNS name ("mongo-service")
# that other pods can use to connect to the database.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  clusterIP: None # This makes it a "headless" service
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# --- StatefulSet for MongoDB ---
# The primary workload for running the database pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: "mongo"
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongoprod
          image: mongo:5
          args:
            - "--wiredTigerCacheSizeGB"
            - "1.0"
            - "--bind_ip"
            - "0.0.0.0"
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "beacon"
          volumeMounts:
            # Mount the persistent storage for the database files
            - name: mongo-persistent-storage
              mountPath: /data/db
            # Mount the init script from our ConfigMap
            - name: mongo-init-script
              mountPath: /docker-entrypoint-initdb.d/init-script.js
              subPath: init-script.js
              readOnly: true
      volumes:
        - name: mongo-init-script
          configMap:
            name: mongo-init-cm
  # Define the volume claim that connects to our PVC for data persistence
  volumeClaimTemplates:
    - metadata:
        name: mongo-persistent-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "" # Use the default storage class or your specific one
        resources:
          requests:
            storage: 2Gi
