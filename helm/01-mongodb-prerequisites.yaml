# This file sets up all the storage and configuration needed by MongoDB before it can run.

# --- Persistent Volume (for local Minikube/Docker Desktop) ---
# In a real cloud environment, your StorageClass would handle this automatically.
# This creates a 2Gi "disk" on the host node for our database to use.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mongo" # This path must exist on your Minikube node

---
# --- Persistent Volume Claim (PVC) ---
# This is the request for storage that our database pod will use.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi # Request 5Gi of storage, which will be bound to the PV above

---
# --- Secret for MongoDB Credentials ---
# Stores sensitive data like passwords securely, not in plain text.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
stringData:
  # These keys will be used as environment variables in the pods
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "example"
